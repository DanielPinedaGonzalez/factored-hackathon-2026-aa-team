 fill="#1a365d"><tspan x="1140" y="61">Comes back later:</tspan><tspan x="1140" y="77">status · add · withdraw</tspan></text><rect x="147.0" y="177.0" width="136" height="56" rx="8" fill="#9b6bd1" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="215" y="194">Model understands.</tspan><tspan x="215" y="210">Code finds the</tspan><tspan x="215" y="226">real charge</tspan></text><rect x="310.0" y="170.0" width="170" height="70" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#5f370e"><tspan x="395" y="194">Policy</tspan><tspan x="395" y="210">4 checks + country rules:</tspan><tspan x="395" y="226">may we act alone?</tspan></text><rect x="540.0" y="182.0" width="120" height="46" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="600" y="202">Proposes the</tspan><tspan x="600" y="218">allowed action</tspan></text><rect x="752.5" y="182.0" width="175" height="46" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="840" y="202">Code executes and</tspan><tspan x="840" y="218">re-reads the real state</tspan></text><rect x="465.0" y="134.0" width="130" height="24" rx="12.0" fill="#fde7dc" stroke="#d95926" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a2d0c"><tspan x="530" y="151">M1 risk signal</tspan></text><rect x="330.0" y="273.0" width="130" height="54" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="395" y="289">Handoff package:</tspan><tspan x="395" y="305">facts · actions ·</tspan><tspan x="395" y="321">open questions</tspan></text><rect x="485.0" y="273.0" width="230" height="54" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="600" y="289">Tells the customer:</tspan><tspan x="600" y="305">“Your case goes to the</tspan><tspan x="600" y="321">fraud team. You are #3.”</tspan></text><rect x="530.0" y="387.0" width="140" height="56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="600" y="412">Router: skill ·</tspan><tspan x="600" y="428">language · priority</tspan></text><rect x="695.0" y="392.0" width="160" height="46" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="775" y="412">Agent sees the package,</tspan><tspan x="775" y="428">does not ask again</tspan></text><polygon points="945,375.0 993.0,415 945,455.0 897.0,415" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="945" y="412">Agent</tspan><tspan x="945" y="428">decides</tspan></text><rect x="1059.0" y="386.0" width="162" height="58" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="1140" y="404">Investigates the claim,</tspan><tspan x="1140" y="420">decides · customer</tspan><tspan x="1140" y="436">is notified</tspan></text><rect x="496.7" y="187" width="26.6" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="510" y="198" text-anchor="middle" font-size="11.5" fill="#334155">yes</text><rect x="247.6" y="243" width="144.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="254" text-anchor="end" font-size="11.5" fill="#334155">no: risk, high amount,</text><rect x="272.4" y="257" width="119.60000000000001" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="268" text-anchor="end" font-size="11.5" fill="#334155">doubt, or no model</text><rect x="923.2" y="187" width="57.6" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="952" y="198" text-anchor="middle" font-size="11.5" fill="#334155">verified</text><rect x="602.6" y="246" width="94.8" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="650" y="257" text-anchor="middle" font-size="11.5" fill="#334155">does not match</text><rect x="1017.3" y="239" width="51.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1043" y="250" text-anchor="middle" font-size="11.5" fill="#334155">replies</text><rect x="934" y="281" width="113.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="292" text-anchor="start" font-size="11.5" fill="#334155">returns it to the</text><rect x="934" y="295" width="144.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="306" text-anchor="start" font-size="11.5" fill="#334155">assistant, with a note</text><rect x="679.9" y="471" width="200.20000000000002" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="780" y="482" text-anchor="middle" font-size="11.5" fill="#334155">not mine: transfers with a note</text><rect x="968.8" y="329" width="82.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1010" y="340" text-anchor="middle" font-size="11.5" fill="#334155">claim opened</text><rect x="485.79999999999995" y="15" width="268.40000000000003" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="620" y="26" text-anchor="middle" font-size="11.5" fill="#334155">comes back later: the process starts again</text><rect x="260" y="494" width="14" height="14" rx="3" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="280" y="506" font-size="12" fill="#475569">Customer</text><rect x="380" y="494" width="14" height="14" rx="3" fill="#9b6bd1" stroke="#4a1f73" stroke-width="1.5"/><text x="400" y="506" font-size="12" fill="#475569">Model</text><rect x="500" y="494" width="14" height="14" rx="3" fill="#4a1f73" stroke="#4a1f73" stroke-width="1.5"/><text x="520" y="506" font-size="12" fill="#475569">Code</text><rect x="620" y="494" width="14" height="14" rx="3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="640" y="506" font-size="12" fill="#475569">Policy</text><rect x="740" y="494" width="14" height="14" rx="3" fill="#fde7dc" stroke="#d95926" stroke-width="1.5"/><text x="760" y="506" font-size="12" fill="#475569">M1 (learned)</text><rect x="860" y="494" width="14" height="14" rx="3" fill="#127a4b" stroke="#0b5133" stroke-width="1.5"/><text x="880" y="506" font-size="12" fill="#475569">Person</text></svg>