e-width="2" marker-end="url(#punta)"/><path d="M665,415 L695,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M855,415 L880,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M1012,415 L1040,415 L1040,89" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M930,375 L930,252 L880,252 L880,228" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M945,455 L945,468 L600,468 L600,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M840,228 L840,345 L1100,345 L1100,386" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><path d="M1180,386 L1180,89" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><path d="M1140,39 L1140,22 L110,22 L110,39" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><rect x="41.0" y="36.0" width="138" height="56" rx="28.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="110" y="52.480000000000004">“I don&#x27;t</tspan><tspan x="110" y="69.0">recognize</tspan><tspan x="110" y="85.52000000000001">this charge”</tspan></text><rect x="541.0" y="39.0" width="118" height="50" rx="25.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="600" y="60.74">Confirms</tspan><tspan x="600" y="77.26">the action</tspan></text><rect x="906.0" y="36.0" width="158" height="56" rx="28.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="985" y="52.480000000000004">Gets a real</tspan><tspan x="985" y="69.0">answer in the</tspan><tspan x="985" y="85.52000000000001">same chat</tspan></text><rect x="1057.0" y="36.0" width="166" height="56" rx="28.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="1140" y="52.480000000000004">Comes back later:</tspan><tspan x="1140" y="69.0">status · add ·</tspan><tspan x="1140" y="85.52000000000001">withdraw</tspan></text><rect x="143.0" y="163.96" width="144" height="82.08" rx="8" fill="#9b6bd1" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="215" y="185.22">Model</tspan><tspan x="215" y="201.74">understands.</tspan><tspan x="215" y="218.26">Code finds the</tspan><tspan x="215" y="234.78">real charge</tspan></text><rect x="306.0" y="163.96" width="178" height="82.08" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#5f370e"><tspan x="395" y="185.22">Policy:</tspan><tspan x="395" y="201.74">4 checks +</tspan><tspan x="395" y="218.26">country rules:</tspan><tspan x="395" y="234.78">may we act alone?</tspan></text><rect x="536.0" y="172.22" width="128" height="65.56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="600" y="193.48">Proposes</tspan><tspan x="600" y="210.0">the allowed</tspan><tspan x="600" y="226.51999999999998">action</tspan></text><rect x="748.5" y="172.22" width="183" height="65.56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="840" y="193.48">Code executes</tspan><tspan x="840" y="210.0">and re-reads</tspan><tspan x="840" y="226.51999999999998">the real state</tspan></text><rect x="461.0" y="131.0" width="138" height="30" rx="15.0" fill="#fde7dc" stroke="#d95926" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#7a2d0c"><tspan x="530" y="151.0">M1 risk signal</tspan></text><rect x="316.0" y="271.22" width="158" height="65.56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="395" y="292.48">Handoff package:</tspan><tspan x="395" y="309.0">facts · actions ·</tspan><tspan x="395" y="325.52000000000004">open questions</tspan></text><rect x="493.0" y="267.22" width="238" height="65.56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="612" y="288.48">Tells the customer:</tspan><tspan x="612" y="305.0">“Your case goes to the</tspan><tspan x="612" y="321.52000000000004">fraud team. You are #3.”</tspan></text><rect x="526.0" y="382.22" width="148" height="65.56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="600" y="403.48">Router: skill ·</tspan><tspan x="600" y="420.0">language ·</tspan><tspan x="600" y="436.52000000000004">priority</tspan></text><rect x="691.0" y="382.22" width="168" height="65.56" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="775" y="403.48">Human agent sees</tspan><tspan x="775" y="420.0">the package, does</tspan><tspan x="775" y="436.52000000000004">not ask again</tspan></text><polygon points="945,360.0 1008.0,415 945,470.0 882.0,415" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="945" y="403.48">Human</tspan><tspan x="945" y="420.0">agent</tspan><tspan x="945" y="436.52000000000004">decides</tspan></text><rect x="1055.0" y="373.96" width="170" height="82.08" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="1140" y="395.22">Investigates the</tspan><tspan x="1140" y="411.74">claim, decides ·</tspan><tspan x="1140" y="428.26000000000005">customer is</tspan><tspan x="1140" y="444.78000000000003">notified</tspan></text><rect x="495.5" y="187" width="29.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="510" y="198" text-anchor="middle" font-size="13" fill="#334155">yes</text><rect x="230.0" y="243" width="162.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="254" text-anchor="end" font-size="13" fill="#334155">no: risk, high amount,</text><rect x="258.0" y="257" width="134.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="268" text-anchor="end" font-size="13" fill="#334155">doubt, or no model</text><rect x="920.0" y="187" width="64.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="952" y="198" text-anchor="middle" font-size="13" fill="#334155">verified</text><rect x="597.0" y="246" width="106.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="650" y="257" text-anchor="middle" font-size="13" fill="#334155">does not match</text><rect x="1014.5" y="239" width="57.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1043" y="250" text-anchor="middle" font-size="13" fill="#334155">replies</text><rect x="934" y="281" width="127.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="292" text-anchor="start" font-size="13" fill="#334155">returns it to the</text><rect x="934" y="295" width="162.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="306" text-anchor="start" font-size="13" fill="#334155">assistant, with a note</text><rect x="667.5" y="471" width="225.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="780" y="482" text-anchor="middle" font-size="13" fill="#334155">not mine: transfers with a note</text><rect x="964.0" y="329" width="92.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1010" y="340" text-anchor="middle" font-size="13" fill="#334155">claim opened</text><rect x="469.0" y="15" width="302.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="620" y="26" text-anchor="middle" font-size="13" fill="#334155">comes back later: the process starts again</text><rect x="260" y="494" width="14" height="14" rx="3" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="280" y="506" font-size="13" fill="#475569">Customer</text><rect x="380" y="494" width="14" height="14" rx="3" fill="#9b6bd1" stroke="#4a1f73" stroke-width="1.5"/><text x="400" y="506" font-size="13" fill="#475569">Model</text><rect x="500" y="494" width="14" height="14" rx="3" fill="#4a1f73" stroke="#4a1f73" stroke-width="1.5"/><text x="520" y="506" font-size="13" fill="#475569">Code</text><rect x="620" y="494" width="14" height="14" rx="3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="640" y="506" font-size="13" fill="#475569">Policy</text><rect x="740" y="494" width="14" height="14" rx="3" fill="#fde7dc" stroke="#d95926" stroke-width="1.5"/><text x="760" y="506" font-size="13" fill="#475569">M1 (learned)</text><rect x="860" y="494" width="14" height="14" rx="3" fill="#127a4b" stroke="#0b5133" stroke-width="1.5"/><text x="880" y="506" font-size="13" fill="#475569">Person</text></svg>