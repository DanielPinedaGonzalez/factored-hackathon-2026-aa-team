"14.5" font-weight="600" fill="#1a365d"><tspan x="1140" y="60.25">Comes back later:</tspan><tspan x="1140" y="77.75">status · add · withdraw</tspan></text><rect x="143.0" y="174.0" width="144" height="62" rx="8" fill="#9b6bd1" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="215" y="192.5">Model understands.</tspan><tspan x="215" y="210.0">Code finds the</tspan><tspan x="215" y="227.5">real charge</tspan></text><rect x="306.0" y="167.0" width="178" height="76" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#5f370e"><tspan x="395" y="192.5">Policy</tspan><tspan x="395" y="210.0">4 checks + country rules:</tspan><tspan x="395" y="227.5">may we act alone?</tspan></text><rect x="536.0" y="179.0" width="128" height="52" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="600" y="201.25">Proposes the</tspan><tspan x="600" y="218.75">allowed action</tspan></text><rect x="748.5" y="179.0" width="183" height="52" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="840" y="201.25">Code executes and</tspan><tspan x="840" y="218.75">re-reads the real state</tspan></text><rect x="461.0" y="131.0" width="138" height="30" rx="15.0" fill="#fde7dc" stroke="#d95926" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#7a2d0c"><tspan x="530" y="151.0">M1 risk signal</tspan></text><rect x="326.0" y="270.0" width="138" height="60" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="395" y="287.5">Handoff package:</tspan><tspan x="395" y="305.0">facts · actions ·</tspan><tspan x="395" y="322.5">open questions</tspan></text><rect x="481.0" y="270.0" width="238" height="60" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="600" y="287.5">Tells the customer:</tspan><tspan x="600" y="305.0">“Your case goes to the</tspan><tspan x="600" y="322.5">fraud team. You are #3.”</tspan></text><rect x="526.0" y="384.0" width="148" height="62" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="600" y="411.25">Router: skill ·</tspan><tspan x="600" y="428.75">language · priority</tspan></text><rect x="691.0" y="389.0" width="168" height="52" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="775" y="411.25">Agent sees the package,</tspan><tspan x="775" y="428.75">does not ask again</tspan></text><polygon points="945,372.0 997.0,415 945,458.0 893.0,415" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="945" y="411.25">Agent</tspan><tspan x="945" y="428.75">decides</tspan></text><rect x="1055.0" y="383.0" width="170" height="64" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff"><tspan x="1140" y="402.5">Investigates the claim,</tspan><tspan x="1140" y="420.0">decides · customer</tspan><tspan x="1140" y="437.5">is notified</tspan></text><rect x="495.5" y="187" width="29.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="510" y="198" text-anchor="middle" font-size="13" fill="#334155">yes</text><rect x="230.0" y="243" width="162.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="254" text-anchor="end" font-size="13" fill="#334155">no: risk, high amount,</text><rect x="258.0" y="257" width="134.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="268" text-anchor="end" font-size="13" fill="#334155">doubt, or no model</text><rect x="920.0" y="187" width="64.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="952" y="198" text-anchor="middle" font-size="13" fill="#334155">verified</text><rect x="597.0" y="246" width="106.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="650" y="257" text-anchor="middle" font-size="13" fill="#334155">does not match</text><rect x="1014.5" y="239" width="57.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1043" y="250" text-anchor="middle" font-size="13" fill="#334155">replies</text><rect x="934" y="281" width="127.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="292" text-anchor="start" font-size="13" fill="#334155">returns it to the</text><rect x="934" y="295" width="162.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="306" text-anchor="start" font-size="13" fill="#334155">assistant, with a note</text><rect x="667.5" y="471" width="225.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="780" y="482" text-anchor="middle" font-size="13" fill="#334155">not mine: transfers with a note</text><rect x="964.0" y="329" width="92.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1010" y="340" text-anchor="middle" font-size="13" fill="#334155">claim opened</text><rect x="469.0" y="15" width="302.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="620" y="26" text-anchor="middle" font-size="13" fill="#334155">comes back later: the process starts again</text><rect x="260" y="494" width="14" height="14" rx="3" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="280" y="506" font-size="13" fill="#475569">Customer</text><rect x="380" y="494" width="14" height="14" rx="3" fill="#9b6bd1" stroke="#4a1f73" stroke-width="1.5"/><text x="400" y="506" font-size="13" fill="#475569">Model</text><rect x="500" y="494" width="14" height="14" rx="3" fill="#4a1f73" stroke="#4a1f73" stroke-width="1.5"/><text x="520" y="506" font-size="13" fill="#475569">Code</text><rect x="620" y="494" width="14" height="14" rx="3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="640" y="506" font-size="13" fill="#475569">Policy</text><rect x="740" y="494" width="14" height="14" rx="3" fill="#fde7dc" stroke="#d95926" stroke-width="1.5"/><text x="760" y="506" font-size="13" fill="#475569">M1 (learned)</text><rect x="860" y="494" width="14" height="14" rx="3" fill="#127a4b" stroke="#0b5133" stroke-width="1.5"/><text x="880" y="506" font-size="13" fill="#475569">Person</text></svg>