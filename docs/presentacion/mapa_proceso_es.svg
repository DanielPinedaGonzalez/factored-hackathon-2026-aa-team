<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 514" font-family="system-ui, Segoe UI, Roboto, sans-serif"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="4" y="8" width="1232" height="118" rx="10" fill="#f4f8ff" stroke="#d9e2ef"/><text x="14" y="24" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">CLIENTE</text><rect x="4" y="134" width="1232" height="200" rx="10" fill="#faf7fd" stroke="#d9e2ef"/><text x="14" y="150" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">ASISTENTE · modelo + código</text><rect x="4" y="342" width="1232" height="136" rx="10" fill="#f1faf5" stroke="#d9e2ef"/><text x="14" y="358" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">EQUIPO HUMANO</text><path d="M175,64 L215,64 L215,177" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M283,205 L310,205" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M480,205 L540,205" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M600,182 L600,86" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M655,64 L840,64 L840,182" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M928,205 L985,205 L985,89" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M470,159 L470,170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M395,240 L395,273" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M460,300 L485,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M600,327 L600,388" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M790,228 L790,262 L440,262 L440,273" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M665,415 L695,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M855,415 L897,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M993,415 L1040,415 L1040,89" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M930,375 L930,252 L880,252 L880,228" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M945,455 L945,468 L600,468 L600,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M840,228 L840,345 L1100,345 L1100,386" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><path d="M1180,386 L1180,89" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><path d="M1140,39 L1140,22 L110,22 L110,39" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><rect x="45.0" y="39.0" width="130" height="50" rx="25.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a365d"><tspan x="110" y="61">«No reconozco</tspan><tspan x="110" y="77">este cargo»</tspan></text><rect x="545.0" y="42.0" width="110" height="44" rx="22.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a365d"><tspan x="600" y="61">Confirma</tspan><tspan x="600" y="77">la acción</tspan></text><rect x="910.0" y="39.0" width="150" height="50" rx="25.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a365d"><tspan x="985" y="61">Recibe respuesta</tspan><tspan x="985" y="77">real en el chat</tspan></text><rect x="1061.0" y="39.0" width="158" height="50" rx="25.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a365d"><tspan x="1140" y="61">Vuelve después:</tspan><tspan x="1140" y="77">consulta · retira</tspan></text><rect x="147.0" y="177.0" width="136" height="56" rx="8" fill="#9b6bd1" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="215" y="194">El modelo entiende.</tspan><tspan x="215" y="210">El código busca</tspan><tspan x="215" y="226">el cargo real</tspan></text><rect x="310.0" y="170.0" width="170" height="70" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#5f370e"><tspan x="395" y="194">Política</tspan><tspan x="395" y="210">4 verificaciones + reglas</tspan><tspan x="395" y="226">del país: ¿se puede solo?</tspan></text><rect x="540.0" y="182.0" width="120" height="46" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="600" y="202">Propone la</tspan><tspan x="600" y="218">acción permitida</tspan></text><rect x="752.5" y="182.0" width="175" height="46" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="840" y="202">El código ejecuta y</tspan><tspan x="840" y="218">relee el estado real</tspan></text><rect x="465.0" y="134.0" width="130" height="24" rx="12.0" fill="#fde7dc" stroke="#d95926" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a2d0c"><tspan x="530" y="151">Señal de riesgo M1</tspan></text><rect x="330.0" y="273.0" width="130" height="54" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="395" y="289">Traspaso:</tspan><tspan x="395" y="305">hechos · acciones ·</tspan><tspan x="395" y="321">preguntas abiertas</tspan></text><rect x="485.0" y="273.0" width="230" height="54" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="600" y="289">Le dice al cliente:</tspan><tspan x="600" y="305">«Tu caso pasa al equipo</tspan><tspan x="600" y="321">de fraude. Eres el 3.º.»</tspan></text><rect x="530.0" y="387.0" width="140" height="56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="600" y="404">Enrutador:</tspan><tspan x="600" y="420">habilidad · idioma</tspan><tspan x="600" y="436">· prioridad</tspan></text><rect x="695.0" y="392.0" width="160" height="46" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="775" y="412">El asesor ve el paquete,</tspan><tspan x="775" y="428">no vuelve a preguntar</tspan></text><polygon points="945,375.0 993.0,415 945,455.0 897.0,415" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="945" y="412">El asesor</tspan><tspan x="945" y="428">decide</tspan></text><rect x="1059.0" y="386.0" width="162" height="58" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff"><tspan x="1140" y="404">Investiga el reclamo,</tspan><tspan x="1140" y="420">decide · se avisa</tspan><tspan x="1140" y="436">al cliente</tspan></text><rect x="499.8" y="187" width="20.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="510" y="198" text-anchor="middle" font-size="11.5" fill="#334155">sí</text><rect x="241.4" y="243" width="150.6" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="254" text-anchor="end" font-size="11.5" fill="#334155">no: riesgo, monto alto,</text><rect x="278.6" y="257" width="113.4" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="268" text-anchor="end" font-size="11.5" fill="#334155">duda o sin modelo</text><rect x="917.0" y="187" width="70.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="952" y="198" text-anchor="middle" font-size="11.5" fill="#334155">verificado</text><rect x="611.9" y="246" width="76.2" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="650" y="257" text-anchor="middle" font-size="11.5" fill="#334155">no coincide</text><rect x="1014.2" y="239" width="57.6" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1043" y="250" text-anchor="middle" font-size="11.5" fill="#334155">responde</text><rect x="934" y="281" width="94.8" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="292" text-anchor="start" font-size="11.5" fill="#334155">lo devuelve al</text><rect x="934" y="295" width="150.6" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="306" text-anchor="start" font-size="11.5" fill="#334155">asistente, con una nota</text><rect x="670.6" y="471" width="218.8" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="780" y="482" text-anchor="middle" font-size="11.5" fill="#334155">no es mío: transfiere con una nota</text><rect x="959.5" y="329" width="101.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1010" y="340" text-anchor="middle" font-size="11.5" fill="#334155">reclamo abierto</text><rect x="482.7" y="15" width="274.6" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="620" y="26" text-anchor="middle" font-size="11.5" fill="#334155">vuelve después: el proceso empieza de nuevo</text><rect x="260" y="494" width="14" height="14" rx="3" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="280" y="506" font-size="12" fill="#475569">Cliente</text><rect x="380" y="494" width="14" height="14" rx="3" fill="#9b6bd1" stroke="#4a1f73" stroke-width="1.5"/><text x="400" y="506" font-size="12" fill="#475569">Modelo</text><rect x="500" y="494" width="14" height="14" rx="3" fill="#4a1f73" stroke="#4a1f73" stroke-width="1.5"/><text x="520" y="506" font-size="12" fill="#475569">Código</text><rect x="620" y="494" width="14" height="14" rx="3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="640" y="506" font-size="12" fill="#475569">Política</text><rect x="740" y="494" width="14" height="14" rx="3" fill="#fde7dc" stroke="#d95926" stroke-width="1.5"/><text x="760" y="506" font-size="12" fill="#475569">M1 (aprendido)</text><rect x="860" y="494" width="14" height="14" rx="3" fill="#127a4b" stroke="#0b5133" stroke-width="1.5"/><text x="880" y="506" font-size="12" fill="#475569">Persona</text></svg>