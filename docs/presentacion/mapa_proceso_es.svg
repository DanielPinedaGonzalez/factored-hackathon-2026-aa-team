stroke-width="2" marker-end="url(#punta)"/><path d="M665,415 L695,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M855,415 L880,415" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M1012,415 L1040,415 L1040,89" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M930,375 L930,252 L880,252 L880,228" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M945,455 L945,468 L600,468 L600,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#punta)"/><path d="M840,228 L840,345 L1100,345 L1100,386" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><path d="M1180,386 L1180,89" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><path d="M1140,39 L1140,22 L110,22 L110,39" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#punta)"/><rect x="41.0" y="36.0" width="138" height="56" rx="28.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="110" y="60.74">«No reconozco</tspan><tspan x="110" y="77.26">este cargo»</tspan></text><rect x="541.0" y="39.0" width="118" height="50" rx="25.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="600" y="60.74">Confirma</tspan><tspan x="600" y="77.26">la acción</tspan></text><rect x="906.0" y="36.0" width="158" height="56" rx="28.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="985" y="60.74">Recibe respuesta</tspan><tspan x="985" y="77.26">real en el chat</tspan></text><rect x="1057.0" y="36.0" width="166" height="56" rx="28.0" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d"><tspan x="1140" y="60.74">Vuelve después:</tspan><tspan x="1140" y="77.26">consulta · retira</tspan></text><rect x="143.0" y="174.0" width="144" height="62" rx="8" fill="#9b6bd1" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.030075187969924" font-weight="600" fill="#ffffff"><tspan x="215" y="195.8045112781955">El modelo entiende.</tspan><tspan x="215" y="210.0">El código busca</tspan><tspan x="215" y="224.1954887218045">el cargo real</tspan></text><rect x="306.0" y="167.0" width="178" height="76" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/><text text-anchor="middle" font-size="11.57142857142857" font-weight="600" fill="#5f370e"><tspan x="395" y="196.34571428571428">Política</tspan><tspan x="395" y="210.0">4 verificaciones + reglas</tspan><tspan x="395" y="223.6542857142857">del país: ¿se puede solo?</tspan></text><rect x="536.0" y="179.0" width="128" height="52" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="12.499999999999998" font-weight="600" fill="#ffffff"><tspan x="600" y="202.625">Propone la</tspan><tspan x="600" y="217.375">acción permitida</tspan></text><rect x="748.5" y="179.0" width="183" height="52" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="840" y="201.74">El código ejecuta y</tspan><tspan x="840" y="218.26000000000002">relee el estado real</tspan></text><rect x="461.0" y="131.0" width="138" height="30" rx="15.0" fill="#fde7dc" stroke="#d95926" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#7a2d0c"><tspan x="530" y="151.0">Señal de riesgo M1</tspan></text><rect x="316.0" y="272.3778195488722" width="158" height="63.244360902255636" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="13.345864661654135" font-weight="600" fill="#ffffff"><tspan x="395" y="293.2518796992481">Traspaso:</tspan><tspan x="395" y="309.0">hechos · acciones ·</tspan><tspan x="395" y="324.74812030075185">preguntas abiertas</tspan></text><rect x="493.0" y="267.22" width="238" height="65.56" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="612" y="288.48">Le dice al cliente:</tspan><tspan x="612" y="305.0">«Tu caso pasa al equipo</tspan><tspan x="612" y="321.52000000000004">de fraude. Eres el 3.º.»</tspan></text><rect x="526.0" y="383.82142857142856" width="148" height="62.35714285714285" rx="8" fill="#4a1f73" stroke="#4a1f73" stroke-width="2"/><text text-anchor="middle" font-size="13.095238095238093" font-weight="600" fill="#ffffff"><tspan x="600" y="404.54761904761904">Enrutador:</tspan><tspan x="600" y="420.0">habilidad · idioma</tspan><tspan x="600" y="435.45238095238096">· prioridad</tspan></text><rect x="691.0" y="389.0" width="168" height="52" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="11.309523809523808" font-weight="600" fill="#ffffff"><tspan x="775" y="413.32738095238096">El asesor ve el paquete,</tspan><tspan x="775" y="426.67261904761904">no vuelve a preguntar</tspan></text><polygon points="945,360.0 1008.0,415 945,470.0 882.0,415" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff"><tspan x="945" y="411.74">El asesor</tspan><tspan x="945" y="428.26">decide</tspan></text><rect x="1055.0" y="383.0" width="170" height="64" rx="8" fill="#127a4b" stroke="#0b5133" stroke-width="2"/><text text-anchor="middle" font-size="13.095238095238093" font-weight="600" fill="#ffffff"><tspan x="1140" y="404.54761904761904">Investiga el reclamo,</tspan><tspan x="1140" y="420.0">decide · se avisa</tspan><tspan x="1140" y="435.45238095238096">al cliente</tspan></text><rect x="499.0" y="187" width="22.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="510" y="198" text-anchor="middle" font-size="13" fill="#334155">sí</text><rect x="223.0" y="243" width="169.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="254" text-anchor="end" font-size="13" fill="#334155">no: riesgo, monto alto,</text><rect x="265.0" y="257" width="127.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="388" y="268" text-anchor="end" font-size="13" fill="#334155">duda o sin modelo</text><rect x="913.0" y="187" width="78.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="952" y="198" text-anchor="middle" font-size="13" fill="#334155">verificado</text><rect x="607.5" y="246" width="85.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="650" y="257" text-anchor="middle" font-size="13" fill="#334155">no coincide</text><rect x="1011.0" y="239" width="64.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1043" y="250" text-anchor="middle" font-size="13" fill="#334155">responde</text><rect x="934" y="281" width="106.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="292" text-anchor="start" font-size="13" fill="#334155">lo devuelve al</text><rect x="934" y="295" width="169.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="938" y="306" text-anchor="start" font-size="13" fill="#334155">asistente, con una nota</text><rect x="657.0" y="471" width="246.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="780" y="482" text-anchor="middle" font-size="13" fill="#334155">no es mío: transfiere con una nota</text><rect x="953.5" y="329" width="113.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="1010" y="340" text-anchor="middle" font-size="13" fill="#334155">reclamo abierto</text><rect x="465.5" y="15" width="309.0" height="14" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="620" y="26" text-anchor="middle" font-size="13" fill="#334155">vuelve después: el proceso empieza de nuevo</text><rect x="260" y="494" width="14" height="14" rx="3" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="280" y="506" font-size="13" fill="#475569">Cliente</text><rect x="380" y="494" width="14" height="14" rx="3" fill="#9b6bd1" stroke="#4a1f73" stroke-width="1.5"/><text x="400" y="506" font-size="13" fill="#475569">Modelo</text><rect x="500" y="494" width="14" height="14" rx="3" fill="#4a1f73" stroke="#4a1f73" stroke-width="1.5"/><text x="520" y="506" font-size="13" fill="#475569">Código</text><rect x="620" y="494" width="14" height="14" rx="3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="640" y="506" font-size="13" fill="#475569">Política</text><rect x="740" y="494" width="14" height="14" rx="3" fill="#fde7dc" stroke="#d95926" stroke-width="1.5"/><text x="760" y="506" font-size="13" fill="#475569">M1 (aprendido)</text><rect x="860" y="494" width="14" height="14" rx="3" fill="#127a4b" stroke="#0b5133" stroke-width="1.5"/><text x="880" y="506" font-size="13" fill="#475569">Persona</text></svg>