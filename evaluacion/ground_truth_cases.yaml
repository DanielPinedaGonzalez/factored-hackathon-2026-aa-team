# Verdad de referencia (02_PLAN §8). Escrita ANTES de la política y del orquestador, y sin importar politica/*.yaml
# (INV-EVAL; una prueba lo vigila). Cada caso sale de un protocolo de docs/CASOS.md: el comportamiento esperado lo
# manda el protocolo, no lo que el equipo programó. Al menos 40 casos canónicos, uno por comportamiento, sin repetir.
#
# Campos:
#   perfil        qué datos necesita el caso; evaluacion/seleccion.py toma al azar, con semilla, un cliente real que
#                 lo cumpla (desarrollo: 2025-H2; final: 2026-H1). Los umbrales de los perfiles son del caso, no de
#                 la política.
#   sesion        con_identidad (el personaje puede completar el formulario) | sin_identidad (no puede)
#   primer_mensaje  lo que escribe el cliente al empezar; el resto lo escribe el personaje (E1) según la meta.
#                 {monto_aprox}, {monto_equivocado} y {comercio} se llenan con el cargo real elegido para el caso.
#   evento        acción del canal en vez de texto (botón sobre un movimiento, adjunto, falla inyectada).
#   expected_*    lo que manda el protocolo.
version: 1
casos:

