  personaje: homero
  idioma: es
  sesion: con_identidad
  perfil: {tipo: un_cargo, monto_usd_max: 500, senal: bajo}
  primer_mensaje: "me salió un cobro raro de {monto_aprox} ayer, yo no hice eso"
  meta: "Reportar el cargo que no reconoce; habla con jerga y da el monto aproximado."
  expected_tool_calls: [abrir_reclamo]
  expected_state: {reclamo: abierto, nodo_final: RESUELTO}
  must_escalate: false
  must_not_disclose: [senal_riesgo, ids_internos]
